<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="apple-itunes-app" content="app-id={{ site.app_store_id }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:image" content="{{ '/assets/screen-workout.jpg' | absolute_url }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/app-icon.png' | relative_url }}">
    <style>
      :root { color-scheme: light dark; font: 16px/1.65 system-ui, sans-serif; }
      body { margin: 0; background: Canvas; color: CanvasText; }
      header, main, footer { box-sizing: border-box; width: min(100% - 2rem, 48rem); margin-inline: auto; }
      header { padding-block: 1.5rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent); }
      header a { margin-right: 1rem; }
      main { min-height: 65vh; padding-block: 1rem 3rem; }
      footer { padding-block: 1rem 2rem; border-top: 1px solid color-mix(in srgb, CanvasText 18%, transparent); font-size: .9rem; }
      a { color: LinkText; }
      h1, h2 { line-height: 1.2; }
      h1 { margin-top: 1.25rem; }
      :focus-visible { outline: 3px solid Highlight; outline-offset: 3px; }
      .hero { text-align: center; padding-block: 1.5rem 1rem; }
      .hero .icon { border-radius: 22%; }
      .hero h1 { margin-top: .5rem; font-size: 2.5rem; }
      .lead { font-size: 1.2rem; max-width: 36rem; margin-inline: auto; }
      .button { display: inline-block; margin-top: .5rem; padding: .8rem 1.4rem; border-radius: 999px; background: #1d7a4a; color: #fff; font-weight: 600; text-decoration: none; }
      .note { font-size: .9rem; opacity: .75; }
      .shots { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-block: 2rem; }
      .shots figure { margin: 0; flex: 1 1 12rem; max-width: 15rem; text-align: center; font-size: .9rem; }
      .shots img { width: 100%; height: auto; border-radius: 1.25rem; box-shadow: 0 .5rem 1.5rem color-mix(in srgb, CanvasText 18%, transparent); }
    </style>
  </head>
  <body>
    <header>
      <a href="{{ '/' | relative_url }}"><strong>Gymtastic</strong></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/support/' | relative_url }}">Support</a>
        <a href="{{ '/privacy-policy/' | relative_url }}">Privacy Policy</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      This site is hosted by GitHub. See
      <a href="https://docs.github.com/site-policy/privacy-policies/github-privacy-statement">GitHub's Privacy Statement</a>.
    </footer>
  </body>
</html>
